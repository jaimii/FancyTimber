name: FancyTimber
version: '${version}'
main: project.kompass.fancyTimber.FancyTimber
api-version: '26.3'
authors: [ JustJaimii ]
depend: [ packetevents ]
softdepend: [ WorldGuard, GriefPrevention, Towny, LWC ]
folia-supported: true
description: Enhanced timber animations. Designed for Project Kompass.

libraries:
 - org.jetbrains.kotlin:kotlin-stdlib:2.4.20

commands:
 ftdebug:
  description: Toggles FancyTimber in-game real-time debugging logs.
  permission: fancytimber.debug
  permission-message: §cYou do not have permission to execute this command.

permissions:
 fancytimber.debug:
  description: Allows operators to toggle FancyTimber debug mode.
  default: op